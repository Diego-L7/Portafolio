<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Moderno</title>
    <!-- Importamos una fuente más estética -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1; /* Indigo moderno */
            --primary-hover: #4f46e5;
            --bg-overlay: rgba(15, 23, 42, 0.75); /* Azul muy oscuro traslúcido */
            --text-main: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Botón de activar con sombra suave */
        .btn-abrir {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn-abrir:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Modal con efecto de desvanecimiento */
        .modal {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-overlay);
            backdrop-filter: blur(4px); /* Difumina el fondo */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        /* Contenido con animación de entrada */
        .modal-contenido {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal.show .modal-contenido {
            transform: scale(1);
        }

        /* Icono de cerrar */
        .cerrar {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
            line-height: 1;
        }

        .cerrar:hover {
            color: var(--text-main);
        }

        h2 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 24px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Botón cerrar interno estilo "outline" o secundario */
        #botonCerrarInterno {
            background: #f1f5f9;
            color: var(--text-main);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        #botonCerrarInterno:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>

    <button class="btn-abrir" id="abrirModal">Abrir ventana modal</button>

    <div id="miModal" class="modal">
        <div class="modal-contenido">
            <span class="cerrar" id="cerrarModal">&times;</span>
            <h2>¡Hola de nuevo!</h2>
            <p>Hemos actualizado el diseño. Ahora es mucho más limpio, utiliza la fuente <b>Inter</b> y tiene un suave efecto de desenfoque en el fondo.</p>
            <button id="botonCerrarInterno">Entendido</button>
        </div>
    </div>

   
      
</body>
</html>
